name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 
        run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
       
  #  - name: Build the Docker image
  #   run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)
